# COTS brushless motors for a 6S 10 in multirotor, as the SITL motor study reads them (prandtl sitl-motors).
#
# Values are manufacturer or reseller datasheet figures gathered 2026-10 (sources per entry). Sellers disagree
# on several figures; "confidence" says how well each entry is supported:
#   datasheet  - consistent across the manufacturer test sheet and resellers
#   mixed      - main figures consistent, one figure conflicting between sources (noted)
#   estimated  - a figure is not published for this KV and is scaled from a sibling KV (noted)
# Resistance scales as 1/KV^2 within one stator (same copper volume, turns ~ 1/KV); no-load current at a fixed
# test voltage scales roughly with KV (spin speed). Replace with thrust-stand data once the motor is bought.
#
# mass_kg is the flying mass: bare motor plus ~5 g of trimmed leads where only the bare weight or a 600 mm
# lead weight is given; FPV motors are listed with short leads already.
# continuous_A: the published continuous (180 s) rating where given, else peak_A / 2 (flagged).
# peak_A: the published short-time peak; null where none is published (no peak check).
motors:
  - name: T-Motor MN3110 KV700
    stator_diameter_mm: 31
    kv: 700
    resistance_ohm: 0.092
    no_load_A: 0.3
    no_load_test_V: 10
    mass_kg: 0.085
    continuous_A: 21
    peak_A: null
    cells: "3-6S"
    confidence: mixed
    note: "one reseller lists 71 mOhm (the KV780 value); the T-Motor test report gives 92 mOhm; 80 g bare; no peak rating published"
    sources:
      - https://www.ligpower.com/product/mn3110-kv700-motor-navigator-type.html
      - https://st.robu.in/product/t-motor-navigator-mn3110-700kv
      - https://www.getfpv.com/tiger-motor-mn3110-17-700kv.html
