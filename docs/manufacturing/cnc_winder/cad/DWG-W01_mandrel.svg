6666666666666" font-size="2.8" font-weight="bold">-</text><line x1="230.0" y1="269.6666666666667" x2="410.0" y2="269.6666666666667" class="thin"/><text x="231.5" y="272.6666666666667" font-size="1.8">TOLERANCE</text><text x="231.5" y="276.73333333333335" font-size="2.6" font-weight="bold">ISO 2768-mK unless stated; dims mm</text><text x="358.0" y="272.6666666666667" font-size="1.8">SHEET</text><text x="358.0" y="276.73333333333335" font-size="2.8" font-weight="bold">1 / 1</text><line x1="230.0" y1="278.3333333333333" x2="410.0" y2="278.3333333333333" class="thin"/><text x="231.5" y="281.3333333333333" font-size="1.8">DRAWN</text><text x="231.5" y="285.4" font-size="2.6" font-weight="bold">bldc_motor.design.drawings  2026-11-05</text><text x="358.0" y="281.3333333333333" font-size="1.8">CHECKED</text><text x="358.0" y="285.4" font-size="2.8" font-weight="bold">NOT CHECKED</text><line x1="356.0" y1="235.0" x2="356.0" y2="287.0" class="thin"/><circle cx="402.0" cy="280.5" r="2.2" class="thin"/><circle cx="402.0" cy="280.5" r="1.0" class="thin"/><polygon points="388.0,279.5 395.0,278.3 395.0,282.7 388.0,281.5" class="thin"/><text x="14.0" y="264.2" font-size="3" font-weight="bold">NOTES</text><text x="14.0" y="269.4" font-size="2.5">1. Grips the stator BORE ONLY: nothing may touch the stator end faces (the needle lays links on the base-side yoke face).</text><text x="14.0" y="273.59999999999997" font-size="2.5">2. Back relief Ø11.61 max over 3.91 mm is set by the needle link path (r_link - needle/2 - 0.3).</text><text x="14.0" y="277.8" font-size="2.5">3. M5 cone screw (expands 3-slot sleeve); front clamp washer Ø13.2 max contacts the bore lip only. Axial position set with a removable loading gauge.</text><text x="14.0" y="282.0" font-size="2.5">4. Sleeve OD runout to spigot &lt;= 0.01 mm. A0 index: loading gauge fork engages the slot before tooth T1.</text><text x="12" y="293.0" font-size="2.6" font-weight="bold">REV P1 - PROTOTYPE - GENERATED FROM PARAMETRIC MODEL - VERIFY AGAINST STEP BEFORE ORDERING</text></svg>