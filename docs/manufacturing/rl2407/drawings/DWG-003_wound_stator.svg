art" font-weight="normal">Slot fill (bare Cu)</text><text x="256.000" y="109.100" font-size="2.3" text-anchor="start" font-weight="normal">0.38 (design); max 0.45</text><line x1="215.000" y1="110.500" x2="395.000" y2="110.500" class="thin"/><text x="216.000" y="114.600" font-size="2.3" text-anchor="start" font-weight="normal">R line-line @25 C</text><text x="256.000" y="114.600" font-size="2.3" text-anchor="start" font-weight="normal">87.7 mOhm ±6 % each pair; pair imbalance &lt;= 2 %</text><line x1="215.000" y1="116.000" x2="395.000" y2="116.000" class="thin"/><text x="216.000" y="120.100" font-size="2.3" text-anchor="start" font-weight="normal">Hipot winding-core</text><text x="256.000" y="120.100" font-size="2.3" text-anchor="start" font-weight="normal">1.05 kV AC 1 s (2U+1000 V), leakage &lt;= 1 mA</text><line x1="215.000" y1="121.500" x2="395.000" y2="121.500" class="thin"/><text x="216.000" y="125.600" font-size="2.3" text-anchor="start" font-weight="normal">Insulation res.</text><text x="256.000" y="125.600" font-size="2.3" text-anchor="start" font-weight="normal">&gt;= 100 MOhm at 500 V DC</text><line x1="215.000" y1="127.000" x2="395.000" y2="127.000" class="thin"/><text x="216.000" y="131.100" font-size="2.3" text-anchor="start" font-weight="normal">Leads</text><text x="256.000" y="131.100" font-size="2.3" text-anchor="start" font-weight="normal">3 x 20 AWG silicone, 150 mm, tinned 3 mm, heat-shrink at joint</text><line x1="215.000" y1="132.500" x2="395.000" y2="132.500" class="thin"/><line x1="215.000" y1="83.000" x2="215.000" y2="132.500" class="thin"/><line x1="255.000" y1="83.000" x2="255.000" y2="132.500" class="thin"/><line x1="395.000" y1="83.000" x2="395.000" y2="132.500" class="thin"/><rect x="230.0" y="235.0" width="180" height="52" class="frame" fill="white"/><text x="231.5" y="238.0" font-size="1.8">PROJECT</text><text x="231.5" y="242.06666666666666" font-size="2.6" font-weight="bold">FPV OUTRUNNER</text><text x="358.0" y="238.0" font-size="1.8">DWG NO</text><text x="358.0" y="242.06666666666666" font-size="2.8" font-weight="bold">DWG-003</text><line x1="230.0" y1="243.66666666666666" x2="410.0" y2="243.66666666666666" class="thin"/><text x="231.5" y="246.66666666666666" font-size="1.8">TITLE</text><text x="231.5" y="250.73333333333332" font-size="3.6" font-weight="bold">WOUND STATOR</text><text x="358.0" y="246.66666666666666" font-size="1.8">REV</text><text x="358.0" y="250.73333333333332" font-size="2.8" font-weight="bold">P1</text><line x1="230.0" y1="252.33333333333334" x2="410.0" y2="252.33333333333334" class="thin"/><text x="231.5" y="255.33333333333334" font-size="1.8">MATERIAL</text><text x="231.5" y="259.4" font-size="2.6" font-weight="bold">DWG-002 + AWG23 magnet wire</text><text x="358.0" y="255.33333333333334" font-size="1.8">SCALE</text><text x="358.0" y="259.4" font-size="2.8" font-weight="bold">4:1</text><line x1="230.0" y1="261.0" x2="410.0" y2="261.0" class="thin"/><text x="231.5" y="264.0" font-size="1.8">FINISH</text><text x="231.5" y="268.06666666666666" font-size="2.6" font-weight="bold">Impregnated (varnish), class 180 min</text><text x="358.0" y="264.0" font-size="1.8">MASS</text><text x="358.0" y="268.06666666666666" font-size="2.8" font-weight="bold">16.01 g</text><line x1="230.0" y1="269.6666666666667" x2="410.0" y2="269.6666666666667" class="thin"/><text x="231.5" y="272.6666666666667" font-size="1.8">TOLERANCE</text><text x="231.5" y="276.73333333333335" font-size="2.6" font-weight="bold">ISO 2768-mK unless stated; dims mm</text><text x="358.0" y="272.6666666666667" font-size="1.8">SHEET</text><text x="358.0" y="276.73333333333335" font-size="2.8" font-weight="bold">4 / 9</text><line x1="230.0" y1="278.3333333333333" x2="410.0" y2="278.3333333333333" class="thin"/><text x="231.5" y="281.3333333333333" font-size="1.8">DRAWN</text><text x="231.5" y="285.4" font-size="2.6" font-weight="bold">bldc_motor.design.drawings  2026-11-05</text><text x="358.0" y="281.3333333333333" font-size="1.8">CHECKED</text><text x="358.0" y="285.4" font-size="2.8" font-weight="bold">NOT CHECKED</text><line x1="356.0" y1="235.0" x2="356.0" y2="287.0" class="thin"/><circle cx="402.0" cy="280.5" r="2.2" class="thin"/><circle cx="402.0" cy="280.5" r="1.0" class="thin"/><polygon points="388.0,279.5 395.0,278.3 395.0,282.7 388.0,281.5" class="thin"/><text x="14.0" y="264.2" font-size="3" font-weight="bold">NOTES</text><text x="14.0" y="269.4" font-size="2.5">1. Wind T1 first; &#x27;*&#x27; = reverse winding direction (CCW viewed from bell side). Inter-coil links routed on the base side.</text><text x="14.0" y="273.59999999999997" font-size="2.5">2. Lead joints: strip enamel (solder pot 450 C or abrasive), solder, sleeve with PTFE/silicone tube; anchor with Kapton + varnish.</text><text x="14.0" y="277.8" font-size="2.5">3. Impregnate: dip in Elmotherm 2340/70 (or equiv. class 180+) and cure per datasheet; no varnish in the bore.</text><text x="14.0" y="282.0" font-size="2.5">4. Test 100 %: line-line resistance (4-wire, temperature corrected), hipot, IR, visual (no nicks, no wire above shoe).</text><text x="12" y="293.0" font-size="2.6" font-weight="bold">REV P1 - PROTOTYPE - GENERATED FROM PARAMETRIC MODEL - VERIFY AGAINST STEP BEFORE ORDERING</text></svg>