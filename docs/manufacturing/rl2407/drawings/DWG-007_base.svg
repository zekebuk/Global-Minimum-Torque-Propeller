.0,278.3 395.0,282.7 388.0,281.5" class="thin"/><text x="14.0" y="264.2" font-size="3" font-weight="bold">NOTES</text><text x="14.0" y="269.4" font-size="2.5">1. Bearing bores coaxial within 0.01 mm and to stator seat within 0.02 mm; machine both bores in one setup or line-bore.</text><text x="14.0" y="273.59999999999997" font-size="2.5">2. Bearings 684ZZ retained with Loctite 641 (H6 housing). Stator bonded to seat with Loctite 638 (0.02-0.09 mm clearance).</text><text x="14.0" y="277.8" font-size="2.5">3. Mounting threads blind; &gt;= 0.8 mm floor protects end turns from over-length screws. Max screw engagement 2.6 mm.</text><text x="14.0" y="282.0" font-size="2.5">4. Window edges break 0.2 mm; lead exit window W1 edges R0.3 min plus silicone grommet sleeve.</text><text x="12" y="293.0" font-size="2.6" font-weight="bold">REV P1 - PROTOTYPE - GENERATED FROM PARAMETRIC MODEL - VERIFY AGAINST STEP BEFORE ORDERING</text></svg>