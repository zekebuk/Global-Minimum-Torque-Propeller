salt spray 24 h.</text><text x="14.0" y="282.0" font-size="2.5">5. Pack in alternating spacers; magnets are brittle and pinch hazards - handle with non-magnetic tools.</text><text x="12" y="293.0" font-size="2.6" font-weight="bold">REV P1 - PROTOTYPE - GENERATED FROM PARAMETRIC MODEL - VERIFY AGAINST STEP BEFORE ORDERING</text></svg>