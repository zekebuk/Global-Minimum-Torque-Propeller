.5" y="268.06666666666666" font-size="2.6" font-weight="bold">Epoxy powder coat (3M Scotchcast 265 or equiv.), class F min</text><text x="358.0" y="264.0" font-size="1.8">MASS</text><text x="358.0" y="268.06666666666666" font-size="2.8" font-weight="bold">11.54 g</text><line x1="230.0" y1="269.6666666666667" x2="410.0" y2="269.6666666666667" class="thin"/><text x="231.5" y="272.6666666666667" font-size="1.8">TOLERANCE</text><text x="231.5" y="276.73333333333335" font-size="2.6" font-weight="bold">ISO 2768-mK unless stated; dims mm</text><text x="358.0" y="272.6666666666667" font-size="1.8">SHEET</text><text x="358.0" y="276.73333333333335" font-size="2.8" font-weight="bold">3 / 9</text><line x1="230.0" y1="278.3333333333333" x2="410.0" y2="278.3333333333333" class="thin"/><text x="231.5" y="281.3333333333333" font-size="1.8">DRAWN</text><text x="231.5" y="285.4" font-size="2.6" font-weight="bold">bldc_motor.design.drawings  2026-11-05</text><text x="358.0" y="281.3333333333333" font-size="1.8">CHECKED</text><text x="358.0" y="285.4" font-size="2.8" font-weight="bold">NOT CHECKED</text><line x1="356.0" y1="235.0" x2="356.0" y2="287.0" class="thin"/><circle cx="402.0" cy="280.5" r="2.2" class="thin"/><circle cx="402.0" cy="280.5" r="1.0" class="thin"/><polygon points="388.0,279.5 395.0,278.3 395.0,282.7 388.0,281.5" class="thin"/><text x="14.0" y="260.0" font-size="3" font-weight="bold">NOTES</text><text x="14.0" y="265.2" font-size="2.5">1. Stack laminations on a mandrel; bond by self-bonding varnish (Backlack), glue-dot or 3 axial laser weld seams on the ID.</text><text x="14.0" y="269.4" font-size="2.5">2. Stack height 7.50 ±0.05 mm under 0.5 MPa; teeth aligned within 0.03 mm; perpendicularity of faces to bore 0.03.</text><text x="14.0" y="273.6" font-size="2.5">3. Coat all surfaces except bore: 0.15-0.25 mm, edges fully covered, no voids; dielectric &gt;= 1.5 kV.</text><text x="14.0" y="277.8" font-size="2.5">4. Bore Ø free of coating (mask or ream after cure) for bonded fit onto base tube (DWG-007).</text><text x="14.0" y="282.0" font-size="2.5">5. Inspect: 100 % visual (edge coverage), 5 % section or spark test.</text><text x="12" y="293.0" font-size="2.6" font-weight="bold">REV P1 - PROTOTYPE - GENERATED FROM PARAMETRIC MODEL - VERIFY AGAINST STEP BEFORE ORDERING</text></svg>