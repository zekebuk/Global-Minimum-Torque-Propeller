79.5 395.0,278.3 395.0,282.7 388.0,281.5" class="thin"/><text x="14.0" y="260.0" font-size="3" font-weight="bold">NOTES</text><text x="14.0" y="265.2" font-size="2.5">1. Material: 0.10 mm non-oriented electrical steel, 10JNEX900, NO10 or equivalent (P1.0/400 &lt;= 13 W/kg).</text><text x="14.0" y="269.4" font-size="2.5">2. Profile per lamination.dxf (1:1 mm). Profile tolerance 0.02 mm. Burr &lt;= 0.01 mm. Flat within 0.02 mm.</text><text x="14.0" y="273.6" font-size="2.5">3. Cut by wire-EDM, photo-etch or fibre laser; stress-relief anneal laser-cut parts (750-800 C, N2) unless vendor shows equal loss.</text><text x="14.0" y="277.8" font-size="2.5">4. Quantity per motor: 75 pcs (7.50 mm stack). Keep grain/rolling direction marked, rotate alternate laminations 90 deg if anisotropic.</text><text x="14.0" y="282.0" font-size="2.5">5. No sharp edges at slot bottom and shoe tips: R0.1 min to protect the magnet wire.</text><text x="12" y="293.0" font-size="2.6" font-weight="bold">REV P1 - PROTOTYPE - GENERATED FROM PARAMETRIC MODEL - VERIFY AGAINST STEP BEFORE ORDERING</text></svg>