name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[cad,dev]
      - name: Lint
        run: |
          ruff check src scripts tests
          ruff format --check src scripts tests
      - name: Test
        run: python -m pytest -q
      - name: Pipeline smoke test
        run: prandtl run designs/mil.yaml designs/gmt.yaml --set-file designs/smoke_overrides.txt --runs-dir "$RUNNER_TEMP/runs"
