name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system tools (CalculiX, gmsh runtime libraries)
        run: sudo apt-get update && sudo apt-get install -y calculix-ccx libglu1-mesa libxcursor1 libxinerama1 libxft2 libxrandr2
      - name: Install
        run: python -m pip install -e .[cad,fea,dev]
      - name: Lint
        run: |
          ruff check src scripts tests
          ruff format --check src scripts tests
      - name: Test
        run: python -m pytest -q
      - name: Pipeline smoke test (fast stages)
        run: prandtl run designs/mil.yaml designs/gmt.yaml --set-file designs/smoke_overrides.txt --runs-dir "$RUNNER_TEMP/runs"
      - name: Pipeline smoke test (CalculiX FEA on the full blade)
        run: prandtl run designs/gmt.yaml --stages fea --set-file designs/smoke_overrides.txt --set cad.export_rotor=false --runs-dir "$RUNNER_TEMP/runs"
