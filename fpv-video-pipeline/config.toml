# FPV video pipeline configuration.
# Every path here is yours to change. Relative paths resolve against this file's folder.

[paths]
# Where ingest.py copies card contents. One folder per shoot day / session is created underneath.
library = "~/FPV/Library"
# Gyroflow writes stabilized intermediates here (ProRes / DNxHR).
stabilized = "~/FPV/Stabilized"
# Final renders.
exports = "~/FPV/Exports"
# Music you have licensed for use (Artlist, Epidemic, YouTube Audio Library, ...).
music = "~/FPV/Music"
# Generated sound-effects library (make_sfx_library.py).
sfx = "~/FPV/SFX"
# Cut lists, previews and shot sheets for phone review (one folder per session).
review = "~/FPV/Review"

[color]
# Fallback conversion LUT when a clip's profile has no entry in [color.luts]. Leave empty to skip.
conversion_lut = "luts/GoPro_GP-Log_to_Rec709.cube"
# Optional: a full grade saved from Resolve as a .drx still (see docs/PIPELINE.md, section 4).
# When set, it replaces the single-LUT approach and is applied to every clip on the timelines.
base_grade_drx = ""

# Log -> Rec.709 conversion per camera profile (profile names as camera_report.py prints them).
# Each camera's log curve is different: the wrong LUT gives wrong contrast and color, so mixed sessions need all three.
[color.luts]
"GP-Log" = "luts/GoPro_GP-Log_to_Rec709.cube"            # HERO11 (Labs) / HERO12 / HERO13
"GP-Log2" = "luts/GoPro_GP-Log2_to_Rec709.cube"          # Mission 1 / Mission 1 Pro (LUTs ship with the camera)
"D-Log M" = "luts/DJI_D-Log_M_to_Rec709.cube"            # DJI Avata 2 (DJI publishes this LUT)

# Node layout the auto grader writes into (must match your .drx node template; see docs/COLOR_ALGORITHM.md).
# "scene" (default, professional practice): grade in camera log, LUT as the output transform near the end.
# "display": LUT on node 2, contrast/saturation after it.
[color.nodes]
order = "scene"
bal = 1
cont = 2
lut = 6

[ingest]
# GoPro writes LRV (low-res preview) and THM (thumbnail) next to each MP4. Keep LRV as edit proxies?
keep_lrv = false
keep_thm = false
verify_checksums = true

[highlights]
# Window length (s) that is scored for "how epic is this moment".
window_s = 3.0
# How many highlight windows to keep per clip.
top_k = 6
# Seconds of separation between kept highlights.
min_gap_s = 4.0

[project]
name_prefix = "FPV"
# Source frame rate you shoot at. 60 gives room for 2x slow-mo and speed ramps on a 30p reel.
source_fps = 59.94

[reel]
width = 1080
height = 1920
fps = 29.97
# Instagram re-encodes everything; give it a clean, high-bitrate master.
codec = "H264"
bitrate_kbps = 25000
# Color tags written into the file. Rec.709 transfer = the 1-1-1 tag the platforms expect; Resolve's default
# Gamma 2.4 tag (1-2-1) is the classic cause of washed-out uploads. render.py verifies the tag after rendering.
color_space_tag = "Rec.709"
gamma_tag = "Rec.709"
max_seconds = 90
# Audio track that holds the song (render.py --no-music mutes it; reel_handoff.py reads the song's start from it).
music_track = 2
# Where Edits runs: "desktop" (Edits desktop app on this PC) or "phone".
edits_target = "desktop"
# Folder reel_handoff.py copies the reel + cue card into: a local "Edits inbox" for desktop,
# or a Google Drive/OneDrive synced folder for phone (e.g. "G:/My Drive/FPV Reels"). Empty = leave in Exports.
handoff = ""

[youtube]
# Upload 4K even from a 2.7K/5.3K source: YouTube assigns higher-bitrate codecs (VP9/AV1) to 4K uploads.
width = 3840
height = 2160
fps = 59.94
codec = "H265"
bitrate_kbps = 80000
color_space_tag = "Rec.709"
gamma_tag = "Rec.709"

# Per-camera overrides for exposure math (scripts/camera_report.py). Built-in values live in fpvpipe/camera.py.
# The Mission 1 Pro's aperture is not confirmed: put the f-number from GoPro's spec sheet here to get ND estimates.
[cameras."Mission 1 Pro"]
# f_number = 2.0
base_iso = 100

[cameras."Avata 2"]
f_number = 2.8
base_iso = 100

[elevenlabs]
# API key is read from the ELEVENLABS_API_KEY environment variable, never stored here.
sfx_model = "eleven_text_to_sound_v2"
sfx_prompt_influence = 0.4
# music_v1 / music_v2 / music_v2_5 (per ElevenLabs docs; availability depends on your plan)
music_model = "music_v2_5"

[youtube_meta]
# Resolve marker color used for chapter markers on the YouTube timeline (one marker per chapter, name = title).
chapter_marker_color = "Cream"
# 19 = Travel & Events, 17 = Sports, 28 = Science & Technology
category_id = 19
client_secrets = "secrets/youtube_client.json"
token_file = "secrets/youtube_token.json"
description_intro = """Cinematic FPV flight."""
gear = ["Quad: <your quad>", "Cameras: GoPro HERO13 Black / GoPro Mission 1 Pro / DJI Avata 2", "Edited in DaVinci Resolve Studio"]
hashtags = ["fpv", "cinematicfpv", "fpvdrone", "gopro"]
tags = ["fpv", "cinematic fpv", "fpv drone", "drone video", "gopro"]

[notify]
# Where a finished overnight preview is copied so it reaches your phone (e.g. a Google Drive / OneDrive synced folder:
# "G:/My Drive/FPV Previews"). Empty = leave it in the Review folder.
phone_folder = ""
# Optional push notification through ntfy (free app, https://ntfy.sh). Pick a long random topic name: anyone who knows
# it can read the messages. Empty = no push. Only the session name, shot count and length are sent, never video.
ntfy_topic = ""
ntfy_server = "https://ntfy.sh"
