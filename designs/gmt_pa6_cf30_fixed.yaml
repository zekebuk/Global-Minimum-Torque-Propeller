# Option C, fixed variant: one-piece molded PA6-CF30 prop (both blades and a hub boss), clamped to the
# motor by a machined cap (docs/hub.md). Thickness schedule from designs/gmt_pa6_cf30.yaml.
name: gmt_pa6_cf30_fixed
description: GMT blade, PA6-CF30, one-piece fixed prop (blades and hub boss molded together, machined clamp cap).
operating_point:
  diameter_in: 22.0
  blade_count: 2
  rpm: 4000.0
  target_thrust_N: 35.0
  rho_kg_m3: 1.225
  mu_air_kg_m_s: 1.81e-5
geometry:
  stations_csv: data/geometry/final_gmt_geometry.csv
  pitch_axis_chord_fraction: 0.25
aero:
  polar: {type: table, directory: data/xfoil_polars}
  tip_loss: true
  trim_to_target_thrust: true
airfoils:
  directory: data/airfoils
  points_per_side: 80
  substitutes: {}
  thickness_scale: [[0.2, 1.1242], [0.45, 1.0], [0.7, 1.0], [1.0, 1.0]]
  trailing_edge_thickness_m: 0.0006
structure:
  material: {name: PA6-CF30 (conditioned), E_Pa: 12.75e+9, nu: 0.35, density_kg_m3: 1280.0, allowable_stress_Pa: 60.0e+6}
molding:
  min_trailing_edge_thickness_m: 0.0006
  max_section_thickness_m: 0.009
  operating_rpm_fractions: [0.9, 1.1]
  frequency_margin: 0.10
  pull_angle_deg: 0.0         # the mold opens along the rotor axis
root:
  enabled: true
  bolt_radii_m: []            # no bolts: the blades are molded into the hub boss
  tab_inner_radius_m: 0.016   # starts 2 mm inside the 36 mm boss
  tab_outer_radius_m: 0.024
  tab_width_m: 0.028
  tab_thickness_m: 0.0085     # thinner than the 10 mm boss: no coincident faces
  transition_sections: 8
  corner_exponent: 8
  tab_centre_s_m: 0.0021      # neck on the centrifugal line through the blade CG
hub:
  variant: one_piece
  boss_diameter_m: 0.036
  boss_thickness_m: 0.010
fea:
  campbell_rpm_fractions: [0.0, 0.9, 1.0, 1.1]
cad:
  apply_trim_offset: true
  export_rotor: true
  export_stl: true
